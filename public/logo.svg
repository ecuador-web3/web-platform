  <!-- ================= Ecuador Web3 - construction standard =================
       Mark centre .............. (500.0, 450.0)   canvas 1000 x 1000
       Frame ............ REGULAR pointy-top hexagon, circumradius 296.0
                          flat-to-flat 512.69
       Arm width ................ 100.0  (uniform on all three arms)
       Arm span ................. exactly 2 hexagon edges = 120 deg
       Ends ..................... cut on the radial bisector at each vertex,
                                  gap 46.0 across the cut
       Corner radii ............. outer elbow 50.0 (= true round join)
                                  inner elbow 25.0
                                  outer end (60 deg) 6.0
                                  inner end (120 deg) 22.0
       Cube ..................... regular hexagon, half flat-to-flat 140.0,
                                  concentric with the frame, sharp corners
       Wordmark ................. Horizon Bold 59.4px, tracking -3.8px

       The blue and red arms are EXACT 120 deg / 240 deg rotations of the
       yellow arm about the mark centre.
       ====================================================================== -->
